name: .NET Core Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:

    runs-on: windows-2022

    steps:

    - name: Checkout source
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Get current date
      id: date
      shell: bash
      run: |
        echo "date=$(date +'%Y.%m.%d.%H.%M')" >> "$GITHUB_OUTPUT"

    - name: Build project
      shell: bash
      run: |
        release_name="PersianBingCalendar-${{ steps.date.outputs.date }}"

        echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"

        dotnet build ./PersianBingCalendar/PersianBingCalendar.csproj \
          -c Release \
          -o ./PersianBingCalendar/bin/Release

        7z a -tzip "${release_name}.zip" ./PersianBingCalendar/bin/Release/*

    - name: Create GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: Release_${{ github.run_number }}
        name: Release ${{ steps.date.outputs.date }}
        files: ${{ env.RELEASE_NAME }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
